services:

  mysql:
    image: mysql:8
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_shortener_db
    ports:
      - "3307:3306"
    
    volumes:
      - mysql_data:/var/lib/mysql


  redis:
    image: redis
    container_name: redis

    ports:
      - "6379:6379"

  app:
    build: ./backend/url-shortener
    container_name: url-shortener

    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

    expose:
      - "8080"

    depends_on:
      - mysql
      - redis
  
  frontend:
    build: ./frontend
    container_name: url-shortener-frontend

    expose:
      - "80"

    depends_on:
      - app
  
  proxy:
    build: ./proxy

    container_name: reverse-proxy

    ports:
      - "80:80"
    
    depends_on:
      - frontend
      - app


volumes:
  mysql_data: